name: drake_2_0_app
description: TMDrake Drake 2.0 Companion App - easy BLE control for the dragonsuit tail.
publish_to: 'none'
version: 0.3.1+8

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.35.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.0
  flutter_foreground_task: ^8.17.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tmdrake_head.png
    - assets/tmdrake_badge.png
    - assets/tmdrake_icon.png
